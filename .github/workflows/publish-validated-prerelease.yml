name: Publish validated Combined PDF prerelease

on:
  push:
    branches: [main]
    paths:
      - VALIDATION.md
      - .github/release-notes/v1.0.1-rc1.md
      - .github/workflows/publish-validated-prerelease.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-candidate:
    name: Publish existing private v1.0.1-rc1 draft
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out current release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify release and synchronise public-facing notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '434198939'
          RELEASE_TARGET: '440963035c217db5dff1b69ef159d78240f82a7c'
        shell: bash
        run: |
          set -euo pipefail
          repository_private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [[ "$repository_private" != 'true' ]]; then
            echo 'Public repository: private-phase publication task is not required.'
            exit 0
          fi

          metadata="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          printf '%s' "$metadata" | jq -e \
            --arg sha "$RELEASE_TARGET" \
            '.id == 434198939 and
             .tag_name == "v1.0.1-rc1" and
             .target_commitish == $sha and
             .prerelease == true and
             ([.assets[].name] | length) == 2 and
             ([.assets[].name] | index("moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip") != null) and
             ([.assets[].name] | index("moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip.sha256") != null)' >/dev/null

          draft="$(printf '%s' "$metadata" | jq -r '.draft')"
          if [[ "$draft" == 'true' ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          elif [[ "$draft" != 'false' ]]; then
            echo 'Unexpected draft status; refusing to modify release.' >&2
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f body="$(cat .github/release-notes/v1.0.1-rc1.md)" \
            --jq '{tag_name: .tag_name, draft: .draft, prerelease: .prerelease, html_url: .html_url}'
