name: Audit full Git history for exposed secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secrets:
    name: Gitleaks all branches and tags
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out all repository history and refs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm that local Git history includes all branches
        shell: bash
        run: |
          set -euo pipefail
          git branch -r
          git tag -l
          echo "Git commits reachable through fetched refs: $(git rev-list --all --count)"
          test "$(git rev-list --all --count)" -gt 1
          git show-ref --verify --quiet refs/remotes/origin/main

      - name: Scan all fetched Git history without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --log-opts="--all" --redact=100 --no-banner /repo
