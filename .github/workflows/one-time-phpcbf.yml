name: One-time Moodle PHPCBF formatter

on:
  push:
    branches:
      - fix/moodle52-phpcs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Moodle Plugin CI code style tools
        run: composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci "^4.5"

      - name: Apply Moodle auto-fixable coding standards
        shell: bash
        run: |
          set +e
          ./ci/bin/moodle-plugin-ci phpcbf .
          result=$?
          set -e
          if [ "$result" -gt 2 ]; then
            echo "PHPCBF unexpectedly failed with status $result"
            exit "$result"
          fi
          git diff --check

      - name: Commit PHP formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.php'
          if git diff --cached --quiet; then
            echo "No auto-fixable changes"
          else
            git commit -m "style: apply Moodle PHPCBF formatting"
            git push origin HEAD:fix/moodle52-phpcs
          fi
