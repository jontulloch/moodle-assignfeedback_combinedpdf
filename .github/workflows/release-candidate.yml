name: Build Combined PDF release candidate

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - version.php
      - scripts/build_release.py
      - .github/workflows/release-candidate.yml
      - .github/release-notes/v1.0.1-rc1.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verify Moodle install ZIP and checksum
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build and verify reproducible ZIP
        run: |
          python3 scripts/build_release.py
          cd dist
          sha256sum -c moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip.sha256
          unzip -t moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip
          unzip -Z -1 moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip | head -25

      - name: Retain installer, checksum and release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combinedpdf-v1.0.1-rc1-package
          path: |
            dist/moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip
            dist/moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip.sha256
            dist/RELEASE_NOTES_v1.0.1-rc1.md
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Prepare private draft GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: combinedpdf-v1.0.1-rc1-package
          path: dist

      - name: Verify release artifacts again
        run: |
          cd dist
          sha256sum -c moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip.sha256
          unzip -t moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip

      - name: Create GitHub draft release for staging review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1-rc1 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Draft release already exists; no change needed."
            exit 0
          fi
          gh release create v1.0.1-rc1 \
            dist/moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip \
            dist/moodle-assignfeedback_combinedpdf-v1.0.1-rc1.zip.sha256 \
            --notes-file dist/RELEASE_NOTES_v1.0.1-rc1.md \
            --title "Combined feedback PDF v1.0.1-rc1 (staging candidate)" \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease \
            --latest=false \
            --repo "$GITHUB_REPOSITORY"
