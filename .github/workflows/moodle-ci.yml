name: Moodle 5.2 Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moodle-tests:
    name: Moodle 5.2 / PHP 8.3 / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, mariadb]
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v5
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, curl, gd, xml, zip, pgsql, pdo_pgsql, mysqli
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci "^4.5"
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle 5.2 and plugin
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_502_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: PHP syntax
        run: moodle-plugin-ci phplint

      - name: Moodle plugin validation
        run: moodle-plugin-ci validate

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Moodle PHP coding standards (PHPCS)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
